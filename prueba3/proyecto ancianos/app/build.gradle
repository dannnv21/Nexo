plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexo.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Necesario para que Robolectric cargue los recursos (layouts, strings, colores).
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Alinea todas las versiones de Kotlin y evita clases duplicadas (kotlin-stdlib-jdk7/jdk8).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
}